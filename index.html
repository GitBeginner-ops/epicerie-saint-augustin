<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Épicerie Saint Augustin - Commande</title>
  <style>
    body { 
      font-family: Georgia, 'Times New Roman', serif; 
      text-align: center; 
      background: #f7f0dd; 
      color: #3a2317;
      padding: 40px 20px; 
      margin: 0;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: #fff;
      padding: 30px 20px;
      border-radius: 10px;
      border: 2px solid #b8863a;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 { color: #8b2f2f; margin-top: 0; font-size: 1.8rem;}
    p { font-size: 1.1rem; line-height: 1.5; }
    .btn { 
      display: inline-block; 
      background: #b8863a; 
      color: white; 
      padding: 15px 30px; 
      text-decoration: none; 
      border-radius: 8px; 
      font-weight: bold; 
      font-size: 1.2rem; 
      margin-top: 20px; 
      transition: background 0.3s;
    }
    .btn:hover { background: #8b2f2f; }
    .note { font-size: 0.85rem; margin-top: 20px; color: #7a6a55; font-style: italic;}
  </style>
</head>
<body>
  <div class="container">
    <h1>Épicerie Saint Augustin</h1>
    <p>Nos pré-ventes de saucissons médaillés et de vin de l'Abbaye de Jouques sont ouvertes !</p>
    
    <!-- Le target="_blank" est la magie qui sort l'utilisateur de Facebook/WhatsApp -->
    <a href="https://script.google.com/a/macros/airbus.com/s/AKfycby46LIWB1zTnrKvkYSVHAd4Mge2J1vIszYzj40FZUdTSPdrS9VdUWLNwvLQun4WrSyI/exec" target="_blank" class="btn">
      Accéder au site
    </a>
    
    <p class="note">Pour ke bon fonctionnement de votre commande, le formulaire va s'ouvrir dans votre navigateur principal.</p>
  </div>
</body>
</html>
